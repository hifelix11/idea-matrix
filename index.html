<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config/firebase-config.js"></script>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>Idea Matrix<span class="dot">.</span></h1>
      <p>Everyone rates every idea on their own 2×2 — then see where you all agree.</p>
    </div>
    <div class="head-tools">
      <div class="sync" id="syncBadge"><i></i><span>not saved</span></div>
      <button class="tool-btn" id="exportBtn" title="Download the whole board as a JSON file">Export JSON</button>
      <button class="tool-btn" id="importBtn" title="Load a board from a JSON file">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="board">
    <section class="panel matrix-panel">
      <div class="matrix-head">
        <span class="matrix-title" id="matrixTitle" contenteditable="true" spellcheck="false"></span>
        <div class="view-toggle" id="viewToggle" style="display:none">
          <button data-mode="avg">Average</button>
          <button data-mode="all">Everyone's dots</button>
        </div>
        <span class="matrix-hint" id="matrixHint"></span>
      </div>

      <div class="matrix-wrap">
        <span class="axis-y" id="axisY" contenteditable="true" spellcheck="false"></span>
        <div class="matrix" id="matrix">
          <div class="grid-h"></div><div class="grid-v"></div>
          <span class="quad tl">CASH GRAB<br>pays, but yawn</span>
          <span class="quad tr">DROP EVERYTHING</span>
          <span class="quad bl">NEXT LIFE</span>
          <span class="quad br">PASSION TRAP<br>fun &amp; broke</span>
        </div>
        <span class="axis-x" id="axisX" contenteditable="true" spellcheck="false"></span>
      </div>

      <div class="placing-banner" id="placingBanner" style="display:none">
        <span id="placingText"></span>
        <button id="cancelPlacing">cancel</button>
      </div>
    </section>

    <aside class="panel ideas-panel">
      <h2>Ideas</h2>
      <div class="ideas-sub" id="ideasSub"></div>
      <div id="ideaList"></div>
      <div class="idea-add">
        <input id="ideaInput" type="text" maxlength="60" placeholder="New idea…">
        <button id="ideaAddBtn">Add</button>
      </div>
    </aside>
  </div>

  <div class="panel legend" id="legend"></div>
</div>

<script src="src/app.js"></script>
</body>
</html>
